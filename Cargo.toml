[workspace]
resolver = "2"
members = [
    "crates/receipt-core",
    "crates/receipt-image",
    "crates/ocr-paddle",
    "crates/ffi",
]

[workspace.package]
# Single source of truth for every crate here (all inherit `version.workspace`).
# CI (.github/workflows/release-tag.yml) fails a `v*` tag push whose name does
# not match this, so bump it in the PR that a release tag will be cut from.
version = "0.7.4"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.80"

[workspace.lints.rust]
# Prefer safe Rust; ONNX/FFI boundaries document any necessary exceptions.
unsafe_code = "warn"

[workspace.lints.clippy]
# Hard correctness; style/perf tighten as modules shrink.
correctness = "deny"
