[workspace]
resolver = "2"
# Listed in dependency order, which is also the layering order enforced by
# tests/layering.rs and documented in CLAUDE.md: each crate may only depend on
# ones above it.
members = [
    "crates/receipt-core",   # device-independent: bbox -> itemized JSON
    "crates/receipt-image",  # device-independent: pixels -> pixels
    "crates/ocr-paddle",     # device-DEPENDENT: pixels -> detections (links ORT)
    "crates/scan",           # composition: pixels -> receipt
    "crates/ffi",            # the single entry point consumers bind to
]

[workspace.package]
# Single source of truth for every crate here (all inherit `version.workspace`).
# CI (.github/workflows/release-tag.yml) fails a `v*` tag push whose name does
# not match this, so bump it in the PR that a release tag will be cut from.
version = "0.11.2"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.80"

[workspace.lints.rust]
# Prefer safe Rust; ONNX/FFI boundaries document any necessary exceptions.
unsafe_code = "warn"

[workspace.lints.clippy]
# Hard correctness; style/perf tighten as modules shrink.
correctness = "deny"
