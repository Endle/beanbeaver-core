# Public default merchant identity rules.
# These map common alias spellings to a canonical merchant family, and drive the
# fuzzy merchant matcher (see receipt-core `merchant_match`). Project-local
# overrides belong in config/merchant_families.toml.
#
# Fields:
#   canonical     display name the merchant is normalized to.
#   aliases       alternate/OCR-mangled spellings matched as exact word-boundary
#                 substrings anywhere in the receipt text.
#   corroborators tokens that, when present anywhere in the receipt, license a
#                 *fuzzy* (approximate) header match to be auto-applied. Without
#                 a corroborator a close fuzzy match is only ever surfaced as a
#                 non-authoritative suggestion, never silently substituted. This
#                 is what stops look-alikes (e.g. "COSTLESS" -> "COSTCO") from
#                 being confidently rewritten.
#   header_aliases spellings that name the family only when they are the WHOLE
#                 OCR'd header (letters and digits compared, spacing ignored),
#                 never as a substring elsewhere. For a stacked logo whose name
#                 line OCR lost, leaving its second line as the header.

[[families]]
canonical = "REAL CANADIAN SUPERSTORE"
aliases = ["REAL CANADIAN", "RCSS"]

# Costco's banner is frequently OCR'd with the leading "C" dropped or an O/0
# confusable ("OSTCO", "C0STCO"). The unmistakable "WHOLESALE" banner licenses
# the fuzzy correction. Replaces the former hardcoded branch in extract_merchant.
[[families]]
canonical = "COSTCO"
aliases = ["COSTCO WHOLESALE", "COSICO"]
corroborators = ["WHOLESALE"]
# The logo stacks COSTCO over WHOLESALE, and the stylized COSTCO is the line OCR
# reads worst. When it falls under the 0.7 detection floor (`aSTCO` at 0.59,
# `COsTCO` at 0.69) or is not detected at all, WHOLESALE is the header and
# COSTCO appears nowhere in the text. The merchant then stays "WHOLESALE", and
# so does everything keyed to COSTCO: the payee, the merchant vocabulary, and
# the gift-card purchase path. Header-only, because a bare alias would also
# claim another chain whose banner contains the word (Wholesale Club). Corpus:
# costco 2026-04-26 $173.15, 2026-07-29 $214.56 recapture, 2026-11-11 $536.86.
header_aliases = ["WHOLESALE"]

# FreshCo's banner is often OCR'd with a trailing confusable ("FRESHCC"), but the
# correct spelling reliably reappears in the store address/footer, so the exact
# alias match on "FRESHCO" recovers it. Replaces the former hardcoded branch.
[[families]]
canonical = "FRESHCO"
aliases = ["FRESHCO"]

# Foody Mart's banner runs the store name into the branch/address on one OCR line
# ("FOODY MART(Branch) 123 Example Rd"); the exact alias match collapses it to the
# canonical name. Replaces the former hardcoded branch.
[[families]]
canonical = "FOODY MART"
aliases = ["FOODY MART"]

# Shoppers' banner row can sit under faint reversed bleed-through that OCR
# reads as a garbage first line ("qqori"), which then wins the raw-header
# slot; the exact alias match on the real banner text below recovers it.
[[families]]
canonical = "SHOPPERS DRUG MART"
aliases = ["SHOPPERS DRUG MART"]

# Pharmasave stores print the independently-owned franchise name as the top
# banner line (e.g. "GRAND GENESIS") with the "PHARMASAVE" banner on the line
# below, so the raw header is the franchise name and the merchant is otherwise
# unrecognized. The exact alias match on "PHARMASAVE" anywhere in the receipt
# recovers the drugstore banner (like Shoppers above).
[[families]]
canonical = "PHARMASAVE"
aliases = ["PHARMASAVE"]

# Longo's prints its name both ways on one receipt: without the apostrophe in
# the header ("Longos <branch> <phone>"), with it in the footer and the rewards
# block. Folding the bare spelling onto the brand's own keeps one display name
# whichever of the two the OCR happens to deliver.
[[families]]
canonical = "LONGO'S"
aliases = ["LONGOS"]

# The Japan Living slogan can be more legible than the logo; the branch
# header still supplies the explicit brand.
[[families]]
canonical = "OOMOMO"
aliases = ["OOMOMO"]
