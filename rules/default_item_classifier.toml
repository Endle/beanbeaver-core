tags = ["grocery/seafood"]
priority = 0
exact_only = false

[[rules]]
id = "legacy_0006"
# "SUGAR BABY" and "SUNVINE" are both watermelon, and both are here to beat
# "SUGAR" (staple, legacy_0017) rather than to add a fruit the list is missing.
# Foody Mart truncates the line to "Sunvine - Sugar Baby Wate", cutting
# "Watermelon" down to "Wate" — so every watermelon keyword below misses while
# "SUGAR" hits, and the melon books as a staple. Sugar Baby is a watermelon
# cultivar and Sunvine is a watermelon brand, so either token alone identifies
# the fruit; both are longer than "SUGAR" and win on `keyword_length` at equal
