[[rules]]
id = "dim_sum"
# Same department-name-as-item pattern as `frozen_department_item` above, from
# the same receipt (Foody Mart 2026-08-07: "Dim Sum 3.99h" under the header
# "&& 19-Dim Sum"). Unlike FROZEN, "DIM SUM" is not an adjective that turns up
# inside unrelated product names, so it needs neither a negative priority nor a
# reserved position.
#
# `prepared_meal` rather than `frozen/dumpling`, on the receipt's own evidence:
# the line is flagged `h` and the receipt's only tax is `hst5% 0.20`, which is
# 5% of 3.99 — Ontario's point-of-sale rebate of the provincial portion on
# prepared food at or under $4. A frozen packaged dim sum would be zero-rated
# basic groceries. So this is ready-to-eat, not a freezer box. (Other branches
# print the department as "&& Dim Sum (Frozen)", so a future frozen-dim-sum SKU
# is plausible — it would pick up `grocery/frozen` from the rule above and still
# land here for the account, which reads correctly either way.)
keywords = ["DIM SUM"]
tags = ["grocery/prepared_meal"]
priority = 0
exact_only = false

[[rules]]
id = "hot_spicy_dip"
# T&T's food-court hot bar, sold by weight (2026-08-25: "HOT SPICY DIP" /
# "0.428 kg @ $29.92/kg", the receipt's own subtext 麻辣燙 — mala tang). Same
# reasoning as `dim_sum` above, from the same kind of evidence: the receipt's
# only tax is "HST (TOTAL GST+PST) $1.67" on a $12.81 subtotal — a full 13%,
# with no point-of-sale rebate, so this is ready-to-eat prepared food and not
# zero-rated basic groceries. The cashier field reads "Foodcourt" and the
# section header is "FOOD" rather than "GROCERY", which agrees.
#
# `grocery/prepared_meal` rather than a restaurant path: every supermarket
# prepared-food rule here lands there, and the bare `restaurant` tag has no
# entry in [accounts], so tagging it that way would book the line to FIXME.
#
# Narrow on purpose — one merchant's SKU wording, no evidence yet of other
# spellings. Widen it when a second receipt shows one.
keywords = ["HOT SPICY DIP"]
tags = ["grocery/prepared_meal"]
priority = 0
exact_only = false

