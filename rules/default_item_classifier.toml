[[rules]]
id = "semantic_tag_0105"
# Costco prints these as "399 DOORDASH2X50" — the denomination is glued to the
# brand, so the keyword has to match mid-token, which the substring path does.
# Unlike LCBO CARD (bare `gift_card`, deliberately account-less), this declares
# the `restaurant/gift_card` path so the card lands in a real account.
keywords = ["DOORDASH"]
tags = ["restaurant/gift_card"]
priority = 0
exact_only = false

[[rules]]
id = "quail_eggs"
# "LA - Quail Eggs" is a fixture of the Chinese-supermarket receipts, and the
# product word is the part OCR keeps destroying: one scan read the line as
# "LA - Quail E8g8" (both g's became 8's). No amount of "EGG" vocabulary reaches
# that — two glyph errors inside a four-letter word is well past what
# `ocr_confusion`'s equality budget will spend, and deliberately so; widening the
# budget to cover it is how the M/N false positives got in. "QUAIL" is the half
# of the name OCR left alone, so match on that instead.
#
# `exact_only`, because the claim that QUAIL "shares no confusable pairs" was
# wrong: I/L is a confusable pair, so `confusable_find` aligned QUAIL against
# QUALI inside "QUALITY" for two corpus lines — "Beat Quality - Squid Tent"
# (Foody Mart, 2026-08-07) and "*Best Quality Frozen Boi" — hanging a
# `grocery/dairy` tag on a squid and a slab of meat. Because the tag union is
# built in FILE order while the account is chosen by priority, the account
# stayed correct (Seafood:Shrimp) and only the *displayed* label went wrong:
# `grocery/dairy` landed last, and the app leads with the last tag. Nothing is
# lost by requiring a literal match — the OCR damage this rule exists to survive
# is in EGGS, never in QUAIL, which every corpus case prints intact.
#
# Negative priority, per the `no_name_med_wht_ovwrp_eggs` precedent below: this
# is a last-resort identification of one product, so a legible "EGGS" still wins
# when OCR leaves it readable, and a meat keyword would win on a quail sold as
# poultry. Every "quail" in the corpus is quail eggs (Foody Mart x3, Al Premium
# x1), so nothing currently relies on that second escape hatch.
keywords = ["QUAIL"]
tags = ["grocery/dairy"]
priority = -80
exact_only = true

[[rules]]
id = "no_name_med_wht_ovwrp_eggs"
# Loblaw's house-brand eggs print as "NN MED WHT OVWRP MRJ" — no name, Medium,
# WHiTe, OVerWRaP (the carton style). The product word never appears, so no
# amount of vocabulary for "egg" can reach this line; the whole phrase IS the
# name. Loblaw does print a friendly "NO NAME EGGS" line on some receipt
# layouts, which is how the other corpus cases classify — but not on all of
# them, and this rule is for the ones where it is absent.
#
# Both spellings are listed because OCR reads the V as a U about as often as it
# gets it right (corpus: OVWRP twice, OUWRP three times, across No Frills and
# Real Canadian Superstore). The "NN" prefix is deliberately left out: one scan
# read it as "IN", and the phrase is already specific without it.
#
# Negative priority, per the `boxer_apparel` precedent: this is a
# last-resort identification of one specific product, so anything more specific
# — including a real "EGGS" keyword if the friendly line is present — wins
# first. Verified against the corpus: these keywords match nothing else.
keywords = ["MED WHT OVWRP", "MED WHT OUWRP"]
tags = ["grocery/dairy"]
priority = -80
exact_only = false

[[rules]]
id = "semantic_tag_0106"
# Line-item discounts. A discount is not a product, so it matches no product
# rule — which used to leave it tagless and therefore indistinguishable from
# "we have no rule for this item", the one thing that made every receipt
# carrying one look permanently unparsed. Tagging it says what it actually is.
#
# The spellings are per-chain and printed literally:
#   Costco   "2087683 TPD/969786"     (TPD = the discount, then the item's code)
#   FreshCo  "INSTANT SAVINGS -$6.00"
#   FreshCo  "YOU SAVED $2.00"        (annotation, usually unpriced)
#
# "TPD/" keeps its slash: bare "TPD" is three characters and would fuzzy-match
# item codes and short product words across the corpus. The slash is always
# printed, and it is what makes the keyword specific.
#
# Priority -90 — *below* every product rule, which is the opposite of what it
# looks like it should be, and the corpus is why. Tags accumulate from every
# matching rule; only the ACCOUNT is decided by priority. So losing the priority
# race is exactly what's wanted here:
#
#   "2080493 TPD/TISSUE  5.50-"  -> tags [household, household/supply, discount]
#                                   account Expenses:Home:HouseholdSupply
#   "2087683 TPD/969786  4.00-"  -> tags [discount]
#                                   account Expenses:Discount
#
# A discount that names what it discounts nets against that category, which is
# what the ledger wants and what the private corpus already asserted (raising
# this above the product rules moved TPD/TISSUE off HouseholdSupply — one
# divergence, and the fixture was right). A discount that names only an item
# code has nothing to net against and files to Expenses:Discount instead of the
# Expenses:FIXME it used to get. Either way it now carries the `discount` tag,
# which is the part that stops it reading as "no rule matched this".
keywords = ["TPD/", "INSTANT SAVINGS", "YOU SAVED"]
tags = ["discount"]
priority = -90
exact_only = false

[[rules]]
id = "panda_cookie_snack"
# A boxed Panda cookie is a packaged snack, not fresh bakery. The bakery rule
# (legacy_0015) matches "COOKIE" exactly, and at equal priority the longer
# keyword wins, so a generic bakery word beats every brand — "OREO COOKIE"
# lands on Bakery for exactly the same reason. Priority 20 settles the account.
#
# The `grocery/bakery` TAG still accumulates from that rule, as tags do
# everywhere here (a rotisserie chicken carries both meat and prepared_meal).
# Only the account is decided by priority. Subtracting the tag would need
# `remove_tags`, which the bundled corpus deliberately never uses — see
# `rules::book::tests::bundled_corpus_uses_no_subtraction`.
keywords = ["PANDA COOKIE"]
tags = ["grocery/snacks"]
priority = 20
exact_only = false

# Skin care sold beside the groceries. "CREAM" is a dairy keyword
# (`legacy_0000`), so every cream that is not dairy lands in the fridge:
# costco/2026-08-26 books a $44.99 `WRINKL CREAM` to
# `Expenses:Food:Grocery:Dairy`. Naming the products fixes it without touching
# the dairy rule, because `compare_match_rank` breaks an equal-priority tie on
# **keyword length** and every keyword here is longer than "CREAM".
#
# Priority is deliberately left at 0. Raising it would also outrank the rules
# that legitimately beat "CREAM" on length today — "SHAVING" (`legacy_0030`)
# already wins "SHAVING CREAM" that way — and the tie-break is enough on its
# own. If a future skin-care item is ever *shorter* than the generic word it
# collides with, that is the case that needs a priority, not this one.
[[rules]]
id = "semantic_tag_0107"
keywords = [
  "WRINKL CREAM",
  "WRINKLE CREAM",
  "ANTI-AGING",
  "ANTI AGING",
  "FACE CREAM",
  "EYE CREAM",
  "HAND CREAM",
  "SKIN CREAM",
  "NIGHT CREAM",
  "DAY CREAM",
  "RETINOL",
  # Brands whose description carries no product word at all, so nothing else
  # here could ever reach them. grace+stella is skin care (eye masks, serums);
  # Costco prints it as the bare brand, "1897598 GRACE+STELLA".
  "GRACE+STELLA",
  "GRACE STELLA",
]
tags = ["personal_care"]
priority = 0
exact_only = false

# Costco sells Schwartz's Montreal smoked meat under the bare brand name --
# "1012120 SCHWARTZ'S", with no product word for the meat rule (`legacy_0001`)
# to match. It is the deli meat and not the same-named spice line: the receipt
# charges it no HST, and on 2026-08-26_costco_737_56 the taxable items sum to
# $230.91 against the $30.02 of tax at 13% ($230.92), which accounts for every
# taxable line and leaves this one zero-rated -- i.e. basic groceries.
[[rules]]
id = "schwartzs_smoked_meat"
keywords = ["SCHWARTZ'S", "SCHWARTZS", "SCHWARTZ"]
tags = ["grocery/meat"]
priority = 0
exact_only = false

# Cosequin is Nutramax's joint supplement **for dogs** (Costco item 1512752
# prints "COSEQUIN180C" -- the 180-count chewable tub), which is why this tags
# `pet` rather than joining the supplements in `legacy_0041`. The tax flag
# cannot make that call for you: pet supplies and human supplements are both
# taxable, and this line is inside the $230.91 taxable set above.
#
# Deliberately not widened toward "COSE..." -- the human-facing sibling product
# is a different brand spelled COSAMIN, and a shortened keyword would fuzzy
# across the two at `FUZZY_THRESHOLD_LONG`.
[[rules]]
id = "cosequin_pet_joint"
keywords = ["COSEQUIN"]
tags = ["pet"]
priority = 0
exact_only = false

# Oyster sauce is a condiment, but the generic OYSTER seafood rule has priority
# 40 so it intentionally beats the broad priority-0 seasoning table. Give the
# complete product phrase a narrowly higher priority instead of lifting every
# seasoning keyword above seafood. Foody Mart truncates SAUCE to SAUC and OCR
# reads the initial O as Q on the receipt that exposed this.
[[rules]]
id = "oyster_sauce_seasoning"
keywords = ["OYSTER SAUCE", "OYSTER SAUC", "QYSTER SAUC"]
tags = ["grocery/seasoning"]
priority = 50
exact_only = true

# Gochujang is hot-pepper paste, not fresh produce. The full phrase covers
# ordinary descriptions; the branded truncated spelling is exactly what Foody
# Mart prints when its fixed-width item column cuts PASTE after the first P.
# Keeping that truncated alias brand-qualified avoids swallowing products such
# as a "Hot Pepper Plant" into seasoning.
[[rules]]
id = "hot_pepper_paste_seasoning"
keywords = ["HOT PEPPER PASTE", "CHORIPDONG - HOT PEPPER P"]
tags = ["grocery/seasoning"]
priority = 10
exact_only = true
