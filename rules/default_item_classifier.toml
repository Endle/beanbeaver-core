[[rules]]
id = "legacy_0005"
# "SCALLOP" lands here rather than in a `grocery/seafood/scallop` leaf of its
# own: the taxonomy has leaves only for fish and shrimp, and scallop is simply
# seafood. It stays 7 characters, so it still outranks legacy_0001's "MEAT" (4)
# on `keyword_length` — which it must, because the line reads "Bay Scallop
# Meat". Declared after legacy_0001, so `grocery/seafood` is the last tag in the
# union and the displayed label, not "Meat".
