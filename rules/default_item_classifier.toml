# Auto-generated from item_categories.py rule tables

# Keywords that may only match literally, never fuzzily. A keyword earns a place
# here when its fuzzy neighborhood contains real products it has no business
# claiming — short, brand-ish tokens are the usual offenders.
#
#   DANDAN  (staple, legacy_0017) fuzzy-matched "PANDA", which is how a boxed
#           Panda cookie picked up a `grocery/staple` tag. Dan dan noodles are
#           always printed in full, so nothing is lost by requiring it.
#   GINGER  (seasoning, legacy_0019) fuzzy-matched "FINGER", tagging a
#           "Beef Rib Boneless Finger" as seasoning. Note this is not OCR
#           damage at all — the receipt is printed and read correctly, and
#           GINGER/FINGER are simply one letter apart in English, which is a
#           neighbor the fuzzy stage should never have entertained.
#   PRESERVED VEG
#           (seasoning, legacy_0019) fuzzy-matched "Preserved duck $" at a T&T
#           deli counter and filed the duck as a seasoning. 榨菜 is always
#           printed in full, so requiring a literal match costs nothing.
exact_only_keywords = ["DANDAN", "GINGER", "PRESERVED VEG"]

# BRANDS — text that names the maker, blanked out before any keyword is matched.
#
# A brand is not a product word, so letting the keyword lists read it is a pure
# false-positive source. Both entries below were real corpus defects:
#
#   Fish Well    "Fish Well - Preserved Veg" matched FISH (legacy_0002) inside
#                the BRAND and filed 榨菜 pickles under Seafood:Fish.
#   Meat Corner  "Meat Corner - AA Beef Pla" matched CORN inside "Meat CORNer"
#                and filed AA beef under Vegetable — 4 corpus lines.
#
# The span is matched wherever it occurs, case- and whitespace-insensitively,
# and never by splitting on " - ": only 19% of corpus item lines have that
# separator (Costco and Walmart never do) and it is not reliably a brand
# boundary — "GROUND PORK - REGULAR" is a product on the left.
#
# Exact matches only, no fuzzy stage: brand names are short and brand-ish, the
# same neighbourhood `exact_only_keywords` exists to keep out of it.
#
# NOT every brand belongs here yet. Several bundled keywords are brands that
# *carry* a category and are the only signal on a truncated line — NATREL (6
# corpus lines of "Natrel - 2% Partly Skimme", where nothing else matches),
# SHODOSHIMA, HEYTEA, TROPICANA, NISSIN, NONGFU. Moving those here would book
# them to FIXME. They can migrate once a brand entry can declare its own tags.
[[brands]]
name = "Fish Well"

[[brands]]
name = "Meat Corner"

# RULE IDS ARE A COMPATIBILITY SURFACE — FROZEN AND ADDITIVE.
#
# An override document may write `disables = ["legacy_0000"]` to void a bundled
# rule, and an id naming no existing rule is a hard load error. That makes these
# ids part of the format: renaming or deleting one breaks user documents that
# reference it. Add new ids freely; do not rename or remove an existing one.

# FIRST ON PURPOSE — this rule's POSITION is load-bearing, not just its priority.
#
# Chinese supermarkets ring a miscellaneous purchase up under its department
# name, so "Frozen" and "Meat" arrive as literal item descriptions (Foody Mart
# 2026-08-07: "Frozen 6.99"). "MEAT" and "BAKERY" already work as keywords
# because the department word is also the product word. "FROZEN" is different:
# it is an ADJECTIVE inside ~25 other corpus item names ("FY - Raw Frozen
# Vannaamei" x10, "*Frozen Raw Vannamei White" x5, "Shirakiku - Frozen Imitat"),
# which is why it was never a keyword. Two separate mechanisms keep it from
# damaging those lines, and BOTH are required:
#
#   priority  -200 makes this the lowest last-resort in the file, so it can only
#             win the account when it is the SOLE match — i.e. the bare "Frozen"
#             line. It must sit below `legacy_0046` ("PEELED" -> shrimp) at -150,
#             the deepest last-resort here: measured at -80, this rule outranked
#             it and moved "BQ - Frozen Raw Peeled Un" off Seafood:Shrimp onto
#             Frozen. If a future rule goes below -200, this one must follow it
#             down. A plain "loses to the default 0" value is NOT enough.
#
#   position  first, because the tag union is assembled in FILE order and the
#             app leads with the LAST tag. Declared later, `grocery/frozen`
#             would land after `grocery/seafood/shrimp` and relabel every frozen
#             shrimp "Frozen". Declared first, it is only ever the last tag when
#             it is the only tag. Do not move this rule down the file.
[[rules]]
id = "frozen_department_item"
keywords = ["FROZEN"]
tags = ["grocery/frozen"]
priority = -200
exact_only = false

[[rules]]
id = "legacy_0000"
# "MILK CHOCOLATE" (note: the product is chocolate made with milk; distinct from
# "CHOCOLATE MILK" the beverage) is listed BEFORE "CHOCOLATE MILK" so the
# per-rule keyword loop in find_all_matches sees it first and breaks on an
# exact match, beating the snacks rule's fuzzy "CHOCOLATE" hit on the
# is_exact tiebreaker. Order matters: do not move "MILK CHOCOLATE" below
# "CHOCOLATE MILK".
keywords = ["EGG", "EGGS", "MILK CHOCOLATE", "STRAWBERRY MILK", "CHOCOLATE MILK", "CHOC MILK", "CHOC MLK", "MILK", "CHEESE", "YOGURT", "YOGOURT", "YOG", "BUTTER", "CREAM", "SOUR CREAM", "COTTAGE", "MARGARINE", "CHEDDAR", "MOZZARELLA", "PARMESAN", "SWEETENED SOYA", "NATREL", "TRUTASTE", "NEILSON"]
