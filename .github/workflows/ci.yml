name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Formatting is a BLOCKING gate. It is deterministic, has no false positives,
  # and is clean at the commit that introduced this job — so it can only fail on
  # a real regression. Split out of the then-advisory `lint` job below (#77 was
  # "Fix lint", which is what an advisory formatting gate reliably produces).
  fmt:
    name: fmt (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out core (public)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt
        run: cargo fmt --all -- --check

  # Style / safety / license gate (Linux only), BLOCKING like `fmt`. Runs in
  # parallel with `test` (no `needs:` edge — lint failure does not skip OCR
  # work). It used to be advisory (`continue-on-error`), and an advisory gate
  # can sit red without anyone noticing; it was made blocking once
  # `-D warnings` was clean on the stable toolchain CI resolves (1.98.1,
  # 2026-09-30). Like `fmt`, it floats on `stable`: a new release's lints can
  # turn it red with no code change, and the fix is a lint PR, not a revert to
  # advisory.
  lint:
    name: lint (clippy, deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Check out core (public)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: clippy
        # Every warning is an error. Correctness and style were the first hard
        # gates; style joined when the god modules were split (#84, #85). The
        # rest followed once nothing was left under them: the wide
        # `process_receipt` / `process_image` signatures carry explicit
        # `#[allow(clippy::too_many_arguments)]` — narrowing them is a core-tag
        # rollout, not a lint fix — and the per-call keyword regexes are now
        # compiled once (`categories::keyword_regex`).
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo-deny (licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
        # This action runs in its own Docker container that has no sccache, so
        # the job-level RUSTC_WRAPPER=sccache would make its `cargo metadata`
        # fail to exec rustc ("No such file or directory"). deny only reads
        # metadata (no compilation), so unset the wrapper for this step.
        env:
          RUSTC_WRAPPER: ""

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Check out core (public)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      # macos-latest runners ship an Xcode whose compiler-rt resource dir is NOT
      # where rustc guesses it: linking the ort/onnxruntime-backed live-E2E binary
      # emits `-lclang_rt.osx` with `-L .../clang/<N>/lib/darwin`, and that guessed
      # path doesn't exist on the image -> `ld: library 'clang_rt.osx' not found`.
      # (Pure-Rust builds link fine, so unit tests hide it; it only bites when a
      # C++-linked binary is actually relinked -- i.e. any cache-miss build.)
      # Locate the real libclang_rt.osx.a under the active Xcode and add its dir to
      # the linker search path so `-lclang_rt.osx` resolves regardless of the guess.
      - name: Fix macOS compiler-rt search path for rustc
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          rt="$(find "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang" \
                  -name 'libclang_rt.osx.a' 2>/dev/null | head -n1)"
          if [[ -z "$rt" ]]; then
            echo "::error::libclang_rt.osx.a not found under the active Xcode toolchain" >&2
            exit 1
          fi
          dir="$(dirname "$rt")"
          echo "compiler-rt dir: $dir"
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-L $dir" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Fast gate: the inline `#[cfg(test)]` lib unit tests, plus `layering` —
      # the executable form of CLAUDE.md's crate-dependency rules. Runs on both
      # Linux and macOS to catch platform-specific divergence (float formatting,
      # path handling); fails in seconds before the slower E2E corpus.
      #
      # `layering` only reads Cargo.toml files (no models, no ORT, no network),
      # so it costs ~0.01s here. It is named explicitly because this step
      # enumerates targets: without `--test layering` the assertion that
      # CLAUDE.md and docs/architecture.md both call "enforced" would pass
      # locally and never be reported by CI.
      - name: Unit tests + layering rules
        run: cargo test -p receipt-core --lib --test layering -- --nocapture

      # Image prep unit tests (EXIF/resize/pad) — pure Rust, no models.
      - name: receipt-image unit tests
        if: runner.os == 'Linux'
        run: cargo test -p receipt-image --lib -- --nocapture

      # Slower gate: the vendored public E2E corpus (tests/receipts_e2e) in CACHED
      # mode only — it replays checked-in `.ocr.json` snapshots (no OCR model, no
      # network). The trailing `cached` filter pins this to `*_cached_e2e` tests so
      # a future live-mode test can't slip into this step. Linux only: the crate is
      # pure Rust with no native deps, so a second macOS run would be redundant with
      # the unit tests above (and macOS runner minutes bill at 10x).
      #
      # `private_e2e` is included so it stays compile-checked; it SKIPS at runtime
      # when BEANBEAVER_PRIVATE_TESTS_DIR is unset. See private-regression.yml for
      # the token-gated private corpus.
      - name: Public E2E corpus (cached mode)
        if: runner.os == 'Linux'
        run: cargo test -p receipt-core --test public_e2e --test private_e2e -- --nocapture cached

      # Live gate: the FULL on-device pipeline (image -> ONNX OCR -> parse ->
      # beancount) over the vendored redacted receipts. Runs on BOTH Linux and
      # macOS so the real det/rec/cls path is exercised on each. The PP-OCRv5
      # mobile models are not vendored (too large); pull them from the public
      # ocr-models-v2 release. CoreML stays OFF (iOS ships CPU), so macOS here
      # uses the same CPU ORT path as production.
      - name: Download OCR models
        run: |
          mkdir -p models
          base="https://github.com/Endle/beanbeaver-core/releases/download/ocr-models-v2"
          for m in PP-OCRv5_mobile_det.onnx PP-OCRv5_mobile_rec.onnx PP-LCNet_x0_25_textline_ori.onnx; do
            curl -sSfL -o "models/$m" "$base/$m"
          done
          ls -la models

      # Soft + hard live gates (see public_live_e2e.rs): random soft samples, plus
      # a fixed allowlist that must match merchant/total within tolerant matchers.
      - name: Public live E2E (on-device OCR)
        run: cargo test -p scan --test public_live_e2e -- --nocapture

      # Pixel-based scan tests cannot catch an encoded-image boundary bypass.
      # Explicitly run this model-backed FFI test (ignored in model-free runs).
      - name: FFI image orientation
        run: cargo test --release -p bb-receipt-ffi --test orientation -- --ignored --nocapture
