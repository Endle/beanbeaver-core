name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-core:
    name: receipt-core (test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out core (public)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Fast gate: the inline `#[cfg(test)]` lib unit tests only. Runs first so a
      # broken unit test fails the job in seconds, before the slower E2E corpus.
      - name: Unit tests
        run: cargo test -p receipt-core --lib -- --nocapture

      # Slower gate: the vendored public cached E2E corpus (tests/receipts_e2e),
      # reusing the artifacts compiled above. `private_e2e` is included so it stays
      # compile-checked here; it SKIPS at runtime when BEANBEAVER_PRIVATE_TESTS_DIR
      # is unset. See private-regression.yml for the token-gated private corpus.
      - name: Public E2E corpus
        run: cargo test -p receipt-core --test public_e2e --test private_e2e -- --nocapture
