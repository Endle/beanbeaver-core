[package]
name = "ocr-paddle"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ocr_paddle"

[lints]
workspace = true

[dependencies]
# Image decode + resize for the detection/recognition preprocessing.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Connected-components / contour finding for DB post-processing.
# `default-features = false` is load-bearing, not tidiness. imageproc's default
# is ["rayon", "image/default"], and that `image/default` re-enables every codec
# on the `image` above -- avif, exr, gif, tiff, webp, bmp, dds, hdr, ico, pnm,
# qoi, tga. Cargo unifies features across the whole graph, so one permissive
# dependant re-arms them for every crate here and the careful
# `features = ["jpeg", "png"]` on the line above buys nothing. It is not free:
# `avif` pulls the rav1e AV1 *encoder*, which was 1.27 MB of the Android .so --
# 23% of all Rust code in it, to encode a format we never write.
# `rayon` must be kept explicitly: `warp_into`, which recognize.rs calls once
# per detected text box, is parallel only under that feature.
imageproc = { version = "0.25", default-features = false, features = ["rayon"] }
# Minimum-rotated-rectangle + polygon geometry for DB box extraction.
geo = "0.29"
# ONNX Runtime for PP-OCRv5 det/rec/cls inference. This crate is the ONLY one in
# the workspace permitted to depend on `ort` -- it is what makes a build
# device-dependent. See CLAUDE.md.
ort = "=2.0.0-rc.12"
# Shared pre-OCR resize/pad (Pillow-parity dims); single source with desktop path.
receipt-image = { path = "../receipt-image" }

# NOTE: `receipt-core` is deliberately absent. This crate produces detections and
# stops there; composing them with the parser is the `scan` crate's job. Adding
# it back would let OCR quietly grow parsing behaviour -- the exact drift the
# layering rules in CLAUDE.md exist to prevent.

[features]
# Apple-only: register the CoreML execution provider (Neural Engine / GPU) for
# det/rec/cls. Off by default so Linux/desktop builds don't link CoreML; the iOS
# xcframework build enables it. See src/session.rs for runtime tuning env vars.
coreml = ["ort/coreml"]
# Android-only: register the XNNPACK execution provider. Off by default so
# desktop and CI builds keep the plain CPU EP; build-android.sh enables it, and
# it requires an ONNX Runtime compiled with --use_xnnpack (see
# beanbeaver-android/scripts/build-ort-android.sh). See src/session.rs.
xnnpack = ["ort/xnnpack"]

[dev-dependencies]
# Parse the e2e `.expected.json` fixtures in the Phase 5 validation test.
serde_json = "1"
