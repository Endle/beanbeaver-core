[package]
name = "bb-receipt-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# The Swift seam. `staticlib` is what the .xcframework links; `cdylib` lets
# uniffi-bindgen introspect the compiled library to emit Swift; `lib` keeps the
# crate usable from Rust tests.
[lib]
name = "bb_receipt_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

# `cargo run --bin uniffi-bindgen -- generate --library <dylib> --language swift`
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# The composition root (pixels -> receipt). Depending on `scan` rather than
# reaching past it into `ocr-paddle` is deliberate: this crate is a binding
# surface, not a place to re-assemble the pipeline. `scan` re-exports the engine
# handle and prep helpers the seam needs.
scan = { path = "../scan" }
receipt-core = { path = "../receipt-core" }
# Decode JPEG/PNG bytes handed across the FFI into an RgbImage.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Content hash of the received image bytes -> the receipt's portable identity.
sha2 = "0.10"
# UniFFI proc-macro bindings ("cli" provides uniffi_bindgen_main for the bin).
uniffi = { version = "0.28", features = ["cli"] }

[features]
# Forward CoreML (Apple Neural Engine / GPU) acceleration to ocr-paddle. Enabled
# by the iOS xcframework build (build-xcframework.sh); off for host bindgen.
coreml = ["scan/coreml"]
xnnpack = ["scan/xnnpack"]
