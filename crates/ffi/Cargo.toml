[package]
name = "bb-receipt-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# The Swift seam. `staticlib` is what the .xcframework links; `cdylib` lets
# uniffi-bindgen introspect the compiled library to emit Swift; `lib` keeps the
# crate usable from Rust tests.
[lib]
name = "bb_receipt_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

# `cargo run --bin uniffi-bindgen -- generate --library <dylib> --language swift`
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# The composition root (pixels -> receipt). Depending on `scan` rather than
# reaching past it into `ocr-paddle` is deliberate: this crate is a binding
# surface, not a place to re-assemble the pipeline. `scan` re-exports the engine
# handle and prep helpers the seam needs.
scan = { path = "../scan" }
receipt-core = { path = "../receipt-core" }
# Decode JPEG/PNG/WebP and apply EXIF orientation before handing pixels to scan.
# The codec capabilities and orientation handling belong to receipt-image.
receipt-image = { path = "../receipt-image" }
# Content hash of the received image bytes -> the receipt's portable identity.
sha2 = "0.10"
# UniFFI proc-macro bindings ("cli" provides uniffi_bindgen_main for the bin).
uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]
# Build encoded-image boundary fixtures without storing extra receipt images.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[features]
# Forward the optional CoreML experiment to ocr-paddle. No shipping consumer
# enables it; iOS deliberately uses the plain CPU EP.
coreml = ["scan/coreml"]
# Forward the optional Android XNNPACK experiment. No shipping consumer enables
# it because the required microkernel archives do not currently link.
xnnpack = ["scan/xnnpack"]
