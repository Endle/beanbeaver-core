[package]
name = "receipt-image"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Pre-OCR image preprocessing (EXIF + resize + pad + JPEG), shared by desktop (PyO3) and iOS."

[lints]
workspace = true

[dependencies]
# WebP is decode-only here and is kept because `decode()` sniffs the format of
# bytes it did not produce (an Android photo picker can hand back a WebP).
# JPEG covers every camera path; PNG covers screenshots.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
thiserror = "2"
