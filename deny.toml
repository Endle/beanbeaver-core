# License guard for the beanbeaver-core Rust workspace.
#
# Rationale: this repo is the permissive (MIT) island shared by the `desktop`
# (GPL, beancount-coupled) and `ios` (MIT, Apple) repos in the beanbeaver split.
# `core` must never be reachable from a copyleft dependency, so only permissive
# licenses are allowed here; GPL/LGPL/AGPL are absent from the list and therefore
# rejected.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # NCSA (permissive, OSI-approved): libfuzzer-sys, pulled transitively by the
    # `image` crate's AVIF encoder (image -> ravif -> rav1e).
    "NCSA",
    # CDLA-Permissive-2.0 (permissive data license): webpki-root-certs, a build
    # dependency of ort-sys (ureq, used to download ONNX Runtime).
    "CDLA-Permissive-2.0",
    # MPL-2.0 (weak, file-level copyleft): uniffi and its deps, pulled in by
    # `crates/ffi`. GPL-compatible and App-Store-safe; enters only via the MIT
    # ios tree, never links into desktop's GPL code.
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Skip first-party (unpublished) workspace crates — their license is set in their
# own Cargo.toml and decided by the author, not enforced against this allowlist.
private = { ignore = true }

[bans]
# Nothing banned by name yet; the license allowlist above is the active guard.

[advisories]
# Security advisories are out of scope for this guard; keep defaults.
